<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password - GlassyLook</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f5f5f5;
    font-family:Arial;
}

.box{
    width:90%;
    max-width:400px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

h2{
    text-align:center;
}

input{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:1px solid #ddd;
    border-radius:8px;
}

button{
    width:100%;
    margin-top:20px;
    padding:14px;
    background:#111;
    color:white;
    border:none;
    border-radius:8px;
    font-weight:bold;
}

.flash{
    background:#ffe5e5;
    color:red;
    padding:10px;
    border-radius:8px;
}

</style>

</head>

<body>

<div class="box">

<h2>
Reset Password
</h2>


{% with messages = get_flashed_messages() %}

{% if messages %}

{% for message in messages %}

<div class="flash">
{{message}}
</div>

{% endfor %}

{% endif %}

{% endwith %}



<form method="POST" action="{{ url_for('reset_admin_password') }}">


<input 
type="password"
name="password"
placeholder="New Password"
required
>


<input 
type="password"
name="confirm_password"
placeholder="Confirm Password"
required
>


<button type="submit">
Update Password
</button>


</form>


</div>

</body>

</html>
