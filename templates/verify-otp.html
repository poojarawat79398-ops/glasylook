<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - GlassyLook</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f6f2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            color: #111;
        }

        p {
            color: #666;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            letter-spacing: 5px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #111;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .brand {
            font-size: 13px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Verify OTP</h1>

        <p>
            Enter the 6-digit OTP sent to your registered mobile number.
        </p>

        <form method="POST">

            <input
                type="text"
                name="otp"
                maxlength="6"
                minlength="6"
                placeholder="Enter OTP"
                required
            >

            <button type="submit">
                Verify OTP
            </button>

        </form>

        <div class="brand">
            GlassyLook Admin
        </div>

    </div>

</body>
</html>
