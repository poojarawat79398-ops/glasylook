<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GlassyLook - Admin Setup</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f7f4ee;
    font-family:Arial,sans-serif;
    padding:20px;
}

.box{
    width:100%;
    max-width:450px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 40px rgba(0,0,0,.10);
}

.logo{
    text-align:center;
    font-size:27px;
    font-weight:bold;
    margin-bottom:8px;
}

.logo span{
    color:#c69b45;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:25px;
}

label{
    display:block;
    font-weight:bold;
    font-size:13px;
    margin:15px 0 7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
    font-size:14px;
    outline:none;
}

input:focus{
    border-color:#c69b45;
}

button{
    width:100%;
    margin-top:22px;
    padding:14px;
    border:0;
    border-radius:10px;
    background:#222;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.error{
    background:#ffecec;
    color:#b00020;
    padding:11px;
    border-radius:8px;
    margin-bottom:15px;
    font-size:13px;
}

.note{
    margin-top:15px;
    padding:12px;
    background:#fff9ed;
    border-radius:9px;
    color:#777;
    font-size:12px;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">
        🪞 Glassy<span>Look</span>
    </div>

    <div class="subtitle">
        Owner / Admin Setup
    </div>

    {% if error %}
    <div class="error">
        {{ error }}
    </div>
    {% endif %}

    <form method="POST">

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Create username"
            required
        >

        <label>Mobile Number</label>
        <input
            type="tel"
            name="phone"
            placeholder="10-digit mobile number"
            maxlength="10"
            minlength="10"
            pattern="[0-9]{10}"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Create password"
            minlength="6"
            required
        >

        <label>Confirm Password</label>
        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm password"
            minlength="6"
            required
        >

        <label>Security PIN</label>
        <input
            type="password"
            name="security_pin"
            placeholder="Create 6-digit PIN"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            required
        >

        <div class="note">
            🔐 Security PIN ko safe jagah yaad rakhein.
            Isi PIN se password recover hoga.
        </div>

        <button type="submit">
            Create Owner Account
        </button>

    </form>

</div>

</body>
</html>
