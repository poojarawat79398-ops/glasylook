<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Glassy Admin - Forgot Password</title>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f4f4;
    font-family:Arial, sans-serif;

}


.box{

    width:100%;
    max-width:420px;
    margin:20px;
    padding:35px;
    background:white;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,0.10);

}


h1{

    text-align:center;
    margin-bottom:10px;
    color:#222;

}


.subtitle{

    text-align:center;
    color:#777;
    margin-bottom:25px;

}


label{

    display:block;
    margin-bottom:7px;
    font-weight:bold;
    color:#333;

}


input{

    width:100%;
    padding:13px;
    margin-bottom:18px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;

}


button{

    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
    cursor:pointer;

}


button:hover{

    background:#333;

}


.back{

    display:block;
    text-align:center;
    margin-top:20px;
    color:#555;
    text-decoration:none;

}


.flash{

    background:#ffe5e5;
    color:#b00020;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
    text-align:center;

}


.note{

    background:#f5f5f5;
    padding:10px;
    border-radius:8px;
    font-size:13px;
    color:#666;
    margin-bottom:15px;

}


</style>

</head>


<body>


<div class="box">


<h1>Reset Password</h1>

<p class="subtitle">
Glassy Admin Security
</p>


{% with messages = get_flashed_messages() %}

{% if messages %}

{% for message in messages %}

<div class="flash">

{{ message }}

</div>

{% endfor %}

{% endif %}

{% endwith %}



<div class="note">

Default Username: <b>glassy</b><br>
Default PIN: <b>aaarti</b>

</div>



<form method="POST">


<label>
Admin Username
</label>

<input 
type="text"
name="username"
placeholder="Enter username"
required
>



<label>
Owner Mobile Number
</label>

<input
type="text"
name="owner_phone"
placeholder="99156 45918"
required
>



<label>
Security PIN
</label>

<input
type="password"
name="pin"
placeholder="Enter PIN"
required
>



<label>
New Password
</label>

<input
type="password"
name="new_password"
placeholder="Enter new password"
required
>



<label>
Confirm New Password
</label>

<input
type="password"
name="confirm_password"
placeholder="Confirm password"
required
>



<button type="submit">

Set New Password

</button>


</form>



<a 
href="{{ url_for('admin_login') }}"
class="back"
>

← Back To Login

</a>


</div>


</body>

</html>
