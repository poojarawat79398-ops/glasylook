<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password - GlassyLook</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f7f4ee;
    font-family:Arial,sans-serif;
    padding:20px;
}

.box{
    width:100%;
    max-width:430px;
    background:white;
    padding:35px;
    border-radius:20px;
    box-shadow:0 10px 35px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin:15px 0 7px;
}

input{
    width:100%;
    padding:13px;
    border:1px solid #ddd;
    border-radius:9px;
}

button{
    width:100%;
    padding:14px;
    margin-top:22px;
    border:0;
    border-radius:10px;
    background:#222;
    color:white;
    font-weight:bold;
}

.error{
    background:#ffecec;
    color:#b00020;
    padding:10px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:12px;
}

.success{
    background:#eafff0;
    color:#08752e;
    padding:10px;
    border-radius:8px;
    font-size:13px;
    margin-bottom:12px;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    text-decoration:none;
    color:#b88932;
}
</style>
</head>

<body>

<div class="box">

<h2>🔐 Change Password</h2>

{% if error %}
<div class="error">{{ error }}</div>
{% endif %}

{% if success %}
<div class="success">{{ success }}</div>
{% endif %}

<form method="POST">

<label>Current Password</label>

<input
    type="password"
    name="current_password"
    required
>

<label>New Password</label>

<input
    type="password"
    name="new_password"
    minlength="6"
    required
>

<label>Confirm New Password</label>

<input
    type="password"
    name="confirm_password"
    minlength="6"
    required
>

<button type="submit">
    Change Password
</button>

</form>

<div class="back">
<a href="{{ url_for('admin') }}">
    ← Back to Dashboard
</a>
</div>

</div>

</body>
</html>
